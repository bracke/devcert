name = "devcert_tests"
description = "AUnit tests for devcert"
version = "0.1.0-dev"
executables = ["devcert_tests"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
aunit = "*"

[[depends-on]]
devcert = "*"

[[pins]]
devcert = { path = ".." }

# devcert depends on hostkit, but Alire honours pins only in the root crate, so
# this root must pin it too or the solver cannot see the workspace copy.
[[pins]]
hostkit = { path = "../../hostkit" }

[build-profiles]
"*" = "development"
