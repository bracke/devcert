name = "devcert"
description = "Local development certificate authority and certificate tool"
version = "0.1.0-dev"
website = "https://github.com/bracke/devcert"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
long-description = """\
  devcert is an Ada binary crate for managing a local development certificate authority, \
  issuing development certificates, and installing or removing trust anchors from supported \
  local trust stores."""
tags = ["certificates", "tls", "https", "development", "security"]
executables = ["devcert"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
cryptolib = "*"

# Facts the host answers differently: the mode bits of a private key, and a
# rename that replaces an existing file. GNAT answers both wrong on some host
# rather than failing -- see the comments in Hostkit.Fs.
[[depends-on]]
truststores = "*"

[[pins]]
truststores = { path = "../truststores" }

[[depends-on]]
hostkit = "*"

[[depends-on]]
i18n = "*"

[[depends-on]]
messages = "*"

[[depends-on]]
terminal_styles = "*"

[[pins]]
cryptolib = { path = "../cryptolib" }

[[pins]]
hostkit = { path = "../hostkit" }

[[pins]]
i18n = { path = "../i18n" }

[[pins]]
messages = { path = "../messages" }

[[pins]]
terminal_styles = { path = "../terminal_styles" }

[build-profiles]
"*" = "development"

# Bundle i18n's generated locale data into share/i18n after every build. devcert
# renders localized output through the messages crate, which serves formatting
# from those files at runtime, so a deployed bin/devcert must ship them (found at
# Exe/../share/i18n). bundle_i18n_data is a standalone Ada tool (tools/i18n_bundle)
# kept out of the app's own bin so it is never installed; build it, then run it.
# Both steps are plain executables -- no shell.
[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "tools/i18n_bundle/bundle_i18n_data.gpr", "-p", "-q"]

[[actions]]
type = "post-build"
command = ["tools/i18n_bundle/bin/bundle_i18n_data"]

[[actions]]
type = "test"
command = ["alr", "-C", "devcert_tests", "build"]
