name: ci

# Builds devcert and runs its test suite on Linux, macOS and Windows.
#
# devcert pins sibling crates by local path in alire.toml (cryptolib, i18n,
# messages, terminal_styles). Building i18n runs its pre-build regeneration,
# which builds the cldr tools (httpclient, zlib, project_tools, cryptolib) and
# fetches the CLDR/UCD data. All of those siblings are checked out next to the
# repo. They must exist as fetchable GitHub repos under the same owner.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # x86_64 macOS: gnat_native=15.2.1 ships no aarch64-darwin binary, so
        # macos-latest (arm64) cannot resolve the pin; macos-15-intel is the last
        # x86_64 image Actions offers.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with: { path: devcert }
      - uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/project_tools", path: project_tools }
      - uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/httpclient", path: httpclient }
      - uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/zlib", path: zlib }
      - uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/cryptolib", path: cryptolib }
      - uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/tarlib", path: tarlib }
      - uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/awklib", path: awklib }
      - uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/regexp", path: regexp }
      - uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/hostkit", path: hostkit }
      - uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/i18n", path: i18n }
      - uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/messages", path: messages }
      - uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/terminal_styles", path: terminal_styles }

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        # i18n's CLDR data fetch (httpclient) and cryptolib link against OpenSSL.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          # brew update periodically fails on Homebrew's own infra; it is not
          # fatal here -- openssl@3 is a stable formula the existing index
          # already resolves.
          brew update || echo "::warning::brew update failed; using the existing formula index"
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          # Homebrew on the x86_64 runner installs under /usr/local; openssl@3 is
          # keg-only, so add its lib dir to the linker's search path.
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"

      - name: Install system libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Alire's gnat_native is a mingw-w64 toolchain, so its ld needs mingw
          # import libraries; take them from the preinstalled MSYS2.
          pacman() { /c/msys64/usr/bin/pacman "$@"; }
          pacman-key() { /c/msys64/usr/bin/pacman-key "$@"; }
          pacman-key --init || true
          pacman-key --populate msys2 || true

          packages="mingw-w64-x86_64-openssl"

          sync() {
            pacman -Sy --noconfirm --needed --disable-download-timeout "$@" $packages
          }

          synced=""
          for attempt in 1 2 3; do
            if sync; then synced=yes; break; fi
            echo "::warning::pacman sync attempt ${attempt} failed"
            sleep 15
          done

          if [ -z "$synced" ]; then
            echo "::warning::signed pacman sync failed; retrying without signature checks"
            sed 's/^SigLevel.*/SigLevel = Never/' /c/msys64/etc/pacman.conf \
              > /c/msys64/tmp/pacman-nosig.conf
            for attempt in 1 2 3; do
              if sync --config C:/msys64/tmp/pacman-nosig.conf; then synced=yes; break; fi
              echo "::warning::unsigned pacman sync attempt ${attempt} failed"
              sleep 15
            done
          fi

          [ -n "$synced" ] || { echo "::error::could not install the MSYS2 packages"; exit 1; }

          echo "CPATH=C:/msys64/mingw64/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Build devcert
        # Regenerates the i18n data and bundles it into share/i18n (post-build).
        shell: bash
        working-directory: devcert
        run: alr --non-interactive build

      - name: Verify the i18n locale data was bundled
        shell: bash
        working-directory: devcert
        run: test -f share/i18n/formats.i18ndata

      - name: Point the runtime at the bundled i18n data (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: devcert
        # devcert finds share/i18n beside its executable, but i18n's own search
        # candidates carry "/../" segments that a mixed-separator lookup mangles
        # on Windows. The data store consults I18N_DATA_DIR first, so give it the
        # forward-slash Windows form (D:/a/...) that GNAT's Ada.Directories and
        # Stream_IO resolve; the backslash form does not open.
        run: |
          SRC="$(cd share/i18n && pwd)"
          echo "I18N_DATA_DIR=$(cygpath -m "$SRC")" >> "$GITHUB_ENV"

      - name: Build the devcert test suite
        shell: bash
        working-directory: devcert/devcert_tests
        run: alr --non-interactive build

      - name: Run the devcert test suite
        shell: bash
        working-directory: devcert/devcert_tests
        # The suite resolves repository paths from its own executable, so the
        # working directory here is free; see docs/testing.md.
        run: alr exec -- ./bin/devcert_tests

      # A system trust store can only be validated on its own host, by hand, so
      # each job keeps the build it just made: bin/devcert with the share/ tree
      # it reads at Exe/../share, plus devcert_tools and devcert.gpr, which is
      # how platform-check finds the root. Unpack on the host in question and
      # `platform-check <host>-system` runs where it lands. All three are
      # x86_64: gnat_native has no aarch64-darwin build, so the macOS one runs
      # under Rosetta on Apple silicon.
      - name: Build the tooling for the artifact
        shell: bash
        working-directory: devcert/devcert_tools
        run: alr --non-interactive build

      - name: Package the binary
        # Not on Windows: tarlib's extraction side calls chown, mknod, symlink
        # and friends, which mingw does not have, so libtarlib will not link
        # there even though the packager never calls any of it.
        if: runner.os != 'Windows'
        shell: bash
        working-directory: devcert
        # tar through tarlib and gzip through zlib, because repository tooling
        # here is Ada -- and because tarlib lets the executable bit through,
        # which the upload step's own zip would drop.
        run: |
          case "${RUNNER_OS}" in
            Linux)   NAME=devcert-linux-x86_64 ;;
            macOS)   NAME=devcert-macos-x86_64 ;;
            Windows) NAME=devcert-windows-x86_64 ;;
            *)       echo "::error::unknown runner OS ${RUNNER_OS}"; exit 1 ;;
          esac
          echo "DEVCERT_ARTIFACT=${NAME}" >> "$GITHUB_ENV"
          (cd tools/package_artifact && alr --non-interactive build)
          ./tools/package_artifact/bin/package_artifact "${NAME}" "${NAME}.tar.gz"

      - name: Upload the binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DEVCERT_ARTIFACT }}
          path: devcert/${{ env.DEVCERT_ARTIFACT }}.tar.gz
          if-no-files-found: error
          retention-days: 30
