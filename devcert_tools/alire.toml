name = "devcert_tools"
description = "Ada-only repository tooling for devcert"
version = "0.1.0-dev"
executables = ["devcert_tools"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
project_tools = "*"

[[depends-on]]
cryptolib = "*"

# platform-check refuses to run a host's trust check on a different host, and
# the host says which it is.
[[depends-on]]
hostkit = "*"

# The catalogue's consistency rules live with the catalogue format.
[[depends-on]]
messages = "*"

# The Firefox profile roots that docs/trust_stores.md lists are this crate's to
# know. Generating that list from it is what stops the document drifting from
# the code, which it had.
[[depends-on]]
truststores = "*"

[[pins]]
project_tools = { path = "../../project_tools" }

[[pins]]
cryptolib = { path = "../../cryptolib" }

[[pins]]
hostkit = { path = "../../hostkit" }

[[pins]]
messages = { path = "../../messages" }

[[pins]]
truststores = { path = "../../truststores" }

[build-profiles]
"*" = "development"
